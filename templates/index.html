<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>MyClothes - E-commerce</title>
    <!-- SDK di PayPal (Sostituisci il tuo client-id se necessario o usa 'test') -->
    <script src="https://www.paypal.com/sdk/js?client-id=BAA32LPTN_t7-cB1dYo-K-fKrGDNkceZr8YyHYH35p1sU_kVQIg08vI6QcbS2JhRgwDDQKCysP34fqAVo0&currency=EUR"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f9f9f9; }
        header { display: flex; justify-content: space-between; align-items: center; background: #333; color: white; padding: 10px 20px; }
        header a { color: white; text-decoration: none; margin-left: 15px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; margin-top: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .product { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        button { background: #0070ba; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; }
        button:hover { background: #005ea6; }
    </style>
</head>
<body>

    <header>
        <h2>MyClothes</h2>
        <div>
            {% if session.get('username') %}
                <span>Benvenuto, <b>{{ session['username'] }}</b></span>
                <a href="{{ url_for('miei_ordini') }}">I miei ordini</a>
                <a href="{{ url_for('logout') }}">Logout</a>
            {% else %}
                <a href="{{ url_for('login') }}">Accedi / Registrati</a>
            {% endif %}
            <a href="/admin">Area Admin</a>
        </div>
    </header>

    <div class="container">
        <h2>Catalogo Prodotti</h2>
        
        <div class="product">
            <div>
                <h3>Felpa MyClothes Classic</h3>
                <p>Prezzo: <b>49.99 €</b></p>
            </div>
            <button onclick="preparaCheckout(49.99, 'Felpa MyClothes Classic')">Paga con PayPal</button>
        </div>

        <div class="product">
            <div>
                <h3>T-Shirt MyClothes Summer</h3>
                <p>Prezzo: <b>24.99 €</b></p>
            </div>
            <button onclick="preparaCheckout(24.99, 'T-Shirt MyClothes Summer')">Paga con PayPal</button>
        </div>

        <div id="checkout-section" style="margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; display:none;">
            <h3>Completa il pagamento per: <span id="product-name"></span></h3>
            <p>Totale: <span id="product-price"></span> €</p>
            <!-- Contenitore del bottone PayPal ufficiale -->
            <div id="paypal-button-container"></div>
        </div>
    </div>

    <script>
        let prezzoCorrente = 0;

        function preparaCheckout(prezzo, nomeProdotto) {
            {% if not session.get('user_id') %}
                alert("Devi effettuare il login per procedere all'acquisto!");
                window.location.href = "{{ url_for('login') }}";
                return;
            {% endif %}

            prezzoCorrente = prezzo;
            document.getElementById('product-name').innerText = nomeProdotto;
            document.getElementById('product-price').innerText = prezzo;
            document.getElementById('checkout-section').style.display = 'block';
            
            // Pulisci eventuali bottoni precedenti se l'utente cambia prodotto
            document.getElementById('paypal-button-container').innerHTML = '';

            // Renderizza il bottone PayPal
            paypal.Buttons({
                createOrder: function(data, actions) {
                    return actions.order.create({
                        purchase_units: [{
                            amount: {
                                value: prezzoCorrente.toString()
                            }
                        }]
                    });
                },
                onApprove: function(data, actions) {
                    return actions.order.capture().then(function(details) {
                        // Invia la conferma al server Flask
                        fetch('/conferma-pagamento-paypal', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                orderID: data.orderID,
                                details: details
                            })
                        })
                        .then(response => response.json())
                        .then(res => {
                            if (res.success) {
                                // REINDIRIZZAMENTO AUTOMATICO ALLA PAGINA DEGLI ORDINI
                                window.location.href = "{{ url_for('miei_ordini') }}";
                            } else {
                                alert('Errore nel salvataggio ordine: ' + res.error);
                            }
                        });
                    });
                }
            }).render('#paypal-button-container');
        }
    </script>
</body>
</html>
