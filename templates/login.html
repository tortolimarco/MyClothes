<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Login Admin - MyClothes</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 20px; width: 100%; max-width: 380px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); text-align: center; }
        h2 { margin-bottom: 20px; color: #0f172a; font-weight: 700; }
        input { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 10px; margin-bottom: 15px; font-size: 1rem; box-sizing: border-box; outline: none; }
        input:focus { border-color: #6366f1; }
        .btn { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); color: white; border: none; padding: 14px; width: 100%; border-radius: 10px; cursor: pointer; font-weight: 600; }
        .error { color: #ef4444; background: #fef2f2; border: 1px solid #fecaca; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 15px; font-weight: 600; }
        .back { display: block; margin-top: 15px; color: #64748b; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔒 Area Riservata Amministrazione</h2>
        {% if errore %}
            <p class="error">⚠️ Password errata!</p>
        {% endif %}
        <form method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <input type="password" name="password" placeholder="Inserisci Password Admin" required>
            <button type="submit" class="btn">Accedi al Pannello Admin</button>
        </form>
        <a href="/" class="back">← Torna al sito</a>
    </div>
</body>
</html>
