<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Login - MyClothes</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background: #0070ba; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #005ea6; }
        .error { color: red; font-size: 14px; text-align: center; }
        a { display: block; text-align: center; margin-top: 15px; color: #0070ba; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="text-align: center;">Accedi / Registrati</h2>
        {% if errore %}
            <p class="error">{{ errore }}</p>
        {% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Entra</button>
        </form>
        <a href="/">Torna alla home</a>
    </div>
</body>
</html>
